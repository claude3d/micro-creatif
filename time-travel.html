height:100%;

z-index:-5;
filter:brightness(0.72);
}
.star{

}
.star.big{width:3px;height:3px;}
.star.small{width:2px;height:2px;}
@keyframes twinkle{
0%{opacity:0.2; transform:scale(0.8);}
50%{opacity:1; transform:scale(1.8);}
100%{opacity:0.2; transform:scale(0.8);}
}
header{
position:relative;
padding:12px 10px 0;
z-index:100;
}
nav{

gap:30px;

align-items:center;
}
nav a{

font-size:18px;
opacity:0.9;
cursor:pointer;
white-space:nowrap;
}
.dropdown{position:relative;display:inline-flex;align-items:center;}
.submenu{

position:absolute;
top:28px;
left:0;
background:rgba(0,0,0,0.72);
border:1px solid rgba(255,255,255,0.3);
border-radius:10px;

}

.lang-btn{

}
.hero{

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:45px 20px 20px;
}
.app-icon{
width:132px;
height:132px;
border-radius:18.5%;
margin-bottom:18px;
overflow:visible;
border:0;
box-shadow:none;
}
.app-icon img{width:100%;height:100%;object-fit:cover;display:block;filter:drop-shadow(0 0 1px rgba(255,255,255,0.95)) drop-shadow(0 0 2px rgba(255,255,255,0.45));}
h1{

line-height:1.0;
margin:8px 0 10px;

}

.manual-download-btn{
margin-top:18px;
padding:10px 24px;
font-size:17px;
font-weight:600;

background:rgba(255,255,255,0.10);

}

}
.content{

margin:0 auto;

}
.mode-grid{

}

}
.mode-card h2{

margin:0 0 12px;
color:#dbe8ff;
}
.mode-card p{

line-height:1.48;
margin:0;
opacity:0.94;
}
.card-grid{
display:grid;
grid-template-columns:repeat(3, 1fr);
gap:18px;
margin-top:24px;
}
.card{

border:1px solid rgba(255,255,255,0.22);
border-radius:18px;
padding:22px;
box-shadow:0 0 20px rgba(0,0,0,0.25);
}
.card h2{
font-size:24px;
margin:0 0 12px;
color:#dbe8ff;
}
.card p{

line-height:1.45;
margin:0;
opacity:0.92;
}
.lower-row{

grid-template-columns:1fr 1.65fr;

}
.feature-list{

border-radius:18px;
padding:24px 28px;
}
.feature-list h2{

font-size:28px;
margin:0 0 14px;
}
ul{margin:0;padding-left:24px;}
li{font-size:18px;line-height:1.55;margin:6px 0;}

.advanced{
margin-top:24px;
padding:28px;
text-align:left;
background:rgba(5,8,24,0.78);
border:1px solid rgba(170,200,255,0.35);
border-radius:22px;
box-shadow:0 0 24px rgba(60,100,180,0.22);
}
.advanced > h2{
text-align:center;
font-size:32px;
margin:0 0 20px;
color:#e2edff;
}
.advanced-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}
.advanced-block{
background:rgba(255,255,255,0.055);
border:1px solid rgba(255,255,255,0.16);
border-radius:16px;
padding:20px 22px;
}
.advanced-block.wide{
grid-column:1 / -1;
}
.advanced-block.centered-half{
grid-column:1 / -1;
width:calc((100% - 18px) / 2);
justify-self:center;
}
.advanced-block h3{
font-size:23px;
margin:0 0 12px;
color:#dbe8ff;
}
.advanced-block h3.centered-title{
text-align:center;
}
.advanced-block p{
font-size:17px;
line-height:1.52;
margin:0 0 12px;
opacity:0.94;
}
.advanced-block p:last-child{margin-bottom:0;}
.advanced-block ul{
margin:0;
padding-left:23px;
}
.advanced-block li{
font-size:17px;
line-height:1.5;
margin:7px 0;
}
.key-row{
display:grid;
grid-template-columns:105px 1fr;
gap:12px;
align-items:center;
margin:9px 0;
font-size:17px;
line-height:1.4;
}
.key-row code{
display:inline-block;
text-align:center;
font-family:Menlo, Monaco, Consolas, monospace;
font-size:14px;
font-weight:bold;
color:white;
background:rgba(255,255,255,0.11);
border:1px solid rgba(255,255,255,0.28);
border-radius:8px;
padding:6px 8px;
white-space:nowrap;
}
.key-row code.multiline-control{font-size:13px;line-height:1.25;white-space:normal;padding-left:6px;padding-right:6px;}

.keyboard-panel{
margin-top:4px;
}
.keyboard-intro{
text-align:center;
max-width:820px;
margin:0 auto 18px !important;
}
.keyboard-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}
.keyboard-card{
background:rgba(0,0,0,0.28);
border:1px solid rgba(190,215,255,0.23);
border-radius:15px;
padding:18px;
}
.keyboard-card h4{
font-size:20px;
margin:0 0 14px;
color:#e6efff;
text-align:center;
}
.shortcut-row{
display:grid;
grid-template-columns:minmax(145px, 0.9fr) 1.35fr;
gap:13px;
align-items:center;
padding:8px 0;
border-bottom:1px solid rgba(255,255,255,0.08);
}
.shortcut-row:last-child{border-bottom:0;}
.keycaps{
display:flex;
flex-wrap:wrap;
gap:5px;
align-items:center;
justify-content:flex-start;
}
.keycap{
display:inline-flex;
align-items:center;
justify-content:center;
min-width:34px;
min-height:31px;
padding:4px 9px;
font-family:Menlo, Monaco, Consolas, monospace;
font-size:14px;
font-weight:700;
line-height:1;
color:#fff;
background:linear-gradient(rgba(255,255,255,0.18), rgba(255,255,255,0.08));
border:1px solid rgba(255,255,255,0.34);
border-bottom-width:3px;
border-radius:7px;
box-shadow:0 2px 6px rgba(0,0,0,0.25), inset 0 1px rgba(255,255,255,0.15);
white-space:nowrap;
}
.keycap.wide{min-width:62px;}
.keycap.command{min-width:72px;}
.key-separator{
font-size:13px;
opacity:0.58;
padding:0 1px;
}
.shortcut-action{
font-size:15.5px;
line-height:1.35;
opacity:0.94;
}
.keyboard-note{
margin:16px 0 0 !important;
font-size:15px !important;
text-align:center;
opacity:0.78 !important;
}


.screenshot-gallery{
margin:6px auto 30px;

.screenshot-grid{

grid-template-columns:repeat(2, minmax(0, 1fr));

.screenshot-frame{

padding:8px;
box-shadow:0 0 22px rgba(40,80,160,0.20);
overflow:hidden;
}
.screenshot-frame img{
display:block;
width:100%;
height:auto;
border-radius:12px;
}


.video-gallery{
margin:8px auto 34px;
}
.video-gallery > h2{
font-size:32px;
margin:0 0 18px;
color:#e2edff;
text-shadow:0 0 14px rgba(140,190,255,0.30);
}
.video-grid{
display:grid;
grid-template-columns:repeat(2, minmax(0, 1fr));
gap:18px;
}
.video-frame{
margin:0;
background:rgba(5,8,24,0.70);
border:1px solid rgba(190,215,255,0.28);
border-radius:18px;
padding:8px;
box-shadow:0 0 22px rgba(40,80,160,0.20);
overflow:hidden;
}
.video-frame.centered-video{
grid-column:1 / -1;
width:80%;
max-width:100%;
justify-self:center;
}
.video-gallery > .video-frame.centered-video{
margin-left:auto;
margin-right:auto;
}
.video-frame video{
display:block;
width:100%;
height:auto;
aspect-ratio:16 / 9;
object-fit:contain;
background:#000;
border-radius:12px;
}


.video-frame video.catalyst-video{
aspect-ratio:2046 / 1534;
}

.video-custom-controls{
display:flex;
align-items:center;
gap:10px;
padding:8px 6px 2px;
}
.guide-audio{
display:none;
}
.video-custom-controls button{
appearance:none;
-webkit-appearance:none;
border:1px solid rgba(255,255,255,0.30);
background:rgba(255,255,255,0.10);
color:white;
border-radius:8px;
min-width:40px;
height:32px;
font-size:17px;
cursor:pointer;
}
.video-custom-controls input[type="range"]{
flex:1;
min-width:0;
}
.video-custom-time{
font-size:13px;
opacity:0.82;
white-space:nowrap;
}

.video-frame figcaption{
padding:12px 8px 5px;
font-size:16px;
line-height:1.4;
opacity:0.92;
}
#guideCaption{height:calc(2.8em + 17px);}
.video-note{
max-width:860px;
margin:18px auto 0;
font-size:17px;
line-height:1.5;
opacity:0.92;
}

.status{
margin:30px auto 0;
max-width:800px;
padding:22px;
background:rgba(90,60,120,0.28);
border:1px solid rgba(255,255,255,0.22);
border-radius:18px;
}
.status h2{font-size:28px;margin:0 0 12px;}
.status p{font-size:18px;line-height:1.45;margin:0;}
.btn{
display:inline-block;
margin-top:28px;
padding:14px 38px;
font-size:20px;
font-weight:bold;
color:white;
text-decoration:none;
border:2px solid rgba(180, 200, 255, 0.75);
border-radius:30px;
background:rgba(255,255,255,0.12);
box-shadow:0 0 18px rgba(120,170,255,0.45);
}
.btn:hover{box-shadow:0 0 28px rgba(150,200,255,0.8);}
footer{
padding:26px 20px 34px;
font-size:18px;
line-height:1.7;
opacity:0.9;
}
@media (max-width:760px){
nav{gap:18px;}
nav a{font-size:15px;}
.lang-btn{font-size:15px;padding:4px 10px;}
h1{font-size:42px;}
.subtitle{font-size:19px;}
.manual-download-btn{font-size:15px;padding:9px 20px;}
.mode-grid{grid-template-columns:1fr;}
.screenshot-grid{grid-template-columns:1fr;}
.video-grid{grid-template-columns:1fr;}
.video-frame.centered-video{grid-column:auto;width:100%;}
.card-grid{grid-template-columns:1fr;}
.lower-row{grid-template-columns:1fr;}
.advanced-grid{grid-template-columns:1fr;}
.advanced-block.wide{grid-column:auto;}
.advanced-block.centered-half{grid-column:auto;width:100%;}
.keyboard-grid{grid-template-columns:1fr;}
.shortcut-row{grid-template-columns:138px 1fr;}
.key-row{grid-template-columns:92px 1fr;}
.app-icon{width:116px;height:116px;border-radius:18.5%;}
.content{padding-left:16px;padding-right:16px;}
.feature-list{padding:20px;}
li{font-size:17px;}
}


/* Arabic / right-to-left layout */
html[dir="rtl"] .submenu{
left:auto;
right:0;
text-align:right;
}
html[dir="rtl"] .feature-list,
html[dir="rtl"] .advanced,
html[dir="rtl"] .advanced-block{
text-align:right;
}
html[dir="rtl"] ul{
padding-left:0;
padding-right:24px;
}
html[dir="rtl"] .advanced-block ul{
padding-left:0;
padding-right:23px;
}
html[dir="rtl"] .key-row,
html[dir="rtl"] .shortcut-row{
direction:ltr;
}
html[dir="rtl"] .key-row > span,
html[dir="rtl"] .shortcut-action{
direction:rtl;
text-align:right;
}
html[dir="rtl"] .keycaps,
html[dir="rtl"] .key-row code{
direction:ltr;
}

</style>
</head>

<script>
document.addEventListener("DOMContentLoaded", function(){
  document.querySelectorAll(".video-frame video").forEach(function(video){
    if(video.dataset.customControlsReady === "1") return;
    video.dataset.customControlsReady = "1";
    video.controls = false;
    video.parentElement.querySelectorAll(":scope > .video-custom-controls").forEach(function(existing){ existing.remove(); });

    const controls = document.createElement("div");
    controls.className = "video-custom-controls";

    const play = document.createElement("button");
    play.type = "button";
    play.textContent = "▶";
    play.setAttribute("aria-label", "Play / Pause");

    const seek = document.createElement("input");
    seek.type = "range";
    seek.min = "0";
    seek.max = "1000";
    seek.value = "0";
    seek.step = "1";
    seek.setAttribute("aria-label", "Video position");

    const time = document.createElement("span");
    time.className = "video-custom-time";
    time.textContent = "0:00 / 0:00";

    const narration = video.id === "guideVideo" ? document.getElementById("guideNarration") : null;
    const requestedRate = Number(video.dataset.playbackRate) > 0 ? Number(video.dataset.playbackRate) : 1;
    let playbackAction = 0;
    let isScrubbing = false;
    // Video seeks can take a moment to decode; firing a new one before the
    // previous finishes makes the frame appear stuck while audio (which has
    // no frame to decode) jumps instantly. These track an in-flight seek so
    // we never fire a second one until the first has actually landed.
    let videoSeekInFlight = false;
    let pendingVideoSeekTime = null;
    function setPlaybackRate(){
      video.defaultPlaybackRate = requestedRate;
      video.playbackRate = requestedRate;
    }
    function requestVideoSeek(target){
      // Before metadata is loaded, setting currentTime silently does nothing
      // in some browsers. Queue it and apply once the video is ready.
      if(video.readyState < 1){
        pendingVideoSeekTime = target;
        return;
      }
      if(videoSeekInFlight){
        pendingVideoSeekTime = target;
        return;
      }
      videoSeekInFlight = true;
      video.currentTime = target;
    }
    video.addEventListener("loadedmetadata", function(){
      if(pendingVideoSeekTime !== null){
        const t = pendingVideoSeekTime;
        pendingVideoSeekTime = null;
        requestVideoSeek(t);
      }
    });
    video.addEventListener("seeked", function(){
      videoSeekInFlight = false;
      if(pendingVideoSeekTime !== null){
        const t = pendingVideoSeekTime;
        pendingVideoSeekTime = null;
        requestVideoSeek(t);
      }
    });
    if(video.readyState >= 1 && pendingVideoSeekTime !== null){
      const t = pendingVideoSeekTime;
      pendingVideoSeekTime = null;
      requestVideoSeek(t);
    }

    controls.append(play, seek, time);
    video.insertAdjacentElement("afterend", controls);

    function fmt(seconds){
      if(!Number.isFinite(seconds)) return "0:00";
      const s = Math.max(0, Math.floor(seconds));
      const m = Math.floor(s / 60);
      const r = String(s % 60).padStart(2, "0");
      return m + ":" + r;
    }

    function update(){
      const duration = Number.isFinite(video.duration) ? video.duration : 0;
      const current = Number.isFinite(video.currentTime) ? video.currentTime : 0;
      if(!isScrubbing) seek.value = duration > 0 ? String(Math.round((current / duration) * 1000)) : "0";
      time.textContent = fmt(current) + " / " + fmt(duration);
      play.textContent = video.paused ? "▶" : "❚❚";
    }

    function togglePlayback(event){
      event.preventDefault();
      event.stopPropagation();
      if(video.paused){
        const action = ++playbackAction;
        if(narration){
          try { narration.currentTime = video.currentTime; } catch (error) {}
          narration.playbackRate = 1;
          const audioStart = narration.play();
          if(audioStart && typeof audioStart.catch === "function") audioStart.catch(function(){
            if(action === playbackAction) update();
          });
        }
        const videoStart = video.play();
        if(videoStart && typeof videoStart.catch === "function") videoStart.catch(function(){
          if(action === playbackAction) update();
        });
      } else {
        playbackAction++;
        video.pause();
        if(narration) narration.pause();
        update();
      }
    }
    let pointerHandled = false;
    play.addEventListener("pointerdown", function(event){
      pointerHandled = true;
      togglePlayback(event);
    });
    play.addEventListener("click", function(event){
      if(pointerHandled){
        pointerHandled = false;
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      togglePlayback(event);
    });

    if(video.id === "guideVideo"){
      document.addEventListener("keydown", function(event){
        if(event.code !== "Space" && event.key !== " ") return;
        const target = event.target;
        if(target !== play && target?.closest?.("a, button, input, textarea, select, [contenteditable='true']")) return;
        event.preventDefault();
        if(event.repeat) return;
        togglePlayback(event);
      });
    }

    function seekToValue(isFinal){
      if(Number.isFinite(video.duration) && video.duration > 0){
        isScrubbing = true;
        const target = (Number(seek.value) / 1000) * video.duration;
        if(isFinal){
          // On release, always land on the exact value the user let go of,
          // even if an in-flight throttled seek was targeting a stale spot.
          pendingVideoSeekTime = target;
          if(!videoSeekInFlight) requestVideoSeek(target);
        } else {
          requestVideoSeek(target);
        }
        if(narration && Number.isFinite(narration.duration) && narration.duration > 0){
          narration.currentTime = Math.min(target, narration.duration);
        }
        time.textContent = fmt(target) + " / " + fmt(video.duration);
      }
    }
    seek.addEventListener("input", function(){ seekToValue(false); });
    seek.addEventListener("change", function(){
      seekToValue(true);
      isScrubbing = false;
    });

    video.addEventListener("loadedmetadata", function(){ setPlaybackRate(); update(); });
    video.addEventListener("durationchange", update);
    video.addEventListener("loadeddata", update);
    video.addEventListener("timeupdate", update);
    video.addEventListener("seeked", update);
    video.addEventListener("play", update);
    video.addEventListener("pause", update);
    video.addEventListener("ended", update);
    setPlaybackRate();
    update();
  });
});
</script>

<script>
const guideVideo = document.getElementById("guideVideo");
const guideNarration = document.getElementById("guideNarration");
if (guideVideo && guideNarration) {
  function syncNarration(force){
    if (!Number.isFinite(guideNarration.duration)) return;
    const drift = guideNarration.currentTime - guideVideo.currentTime;
    if (force || Math.abs(drift) > 1) {
      guideNarration.currentTime = Math.min(guideVideo.currentTime, guideNarration.duration);
    }
    guideNarration.playbackRate = 1;
  }
  guideVideo.addEventListener("timeupdate", function(){
    if (!guideVideo.paused && !guideVideo.seeking) syncNarration(false);
  });
  guideVideo.addEventListener("playing", function(){ syncNarration(false); });
  guideVideo.addEventListener("pause", function(){
    guideNarration.pause();
    guideNarration.playbackRate = 1;
  });
  guideVideo.addEventListener("seeking", function(){ syncNarration(true); });
  guideVideo.addEventListener("seeked", function(){ syncNarration(true); });
  guideVideo.addEventListener("ended", function(){
    guideNarration.pause();
    guideNarration.playbackRate = 1;
  });
}
</script>
