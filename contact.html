<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro Créatif – Contact</title>
<meta name="description" content="Contact Micro Créatif for questions, bug reports, or information about our astronomy apps.">
<meta name="keywords" content="Micro Créatif contact, astronomy app support, telescope app, RA Dec AZ Alt, virtual telescope, solar system app">
<meta name="author" content="Micro Créatif">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Micro Créatif – Contact">
<meta property="og:description" content="Contact Micro Créatif for questions, bug reports, or information about our astronomy apps.">
<meta property="og:url" content="https://microcreatif.ca/contact.html">
<meta property="og:type" content="website">
<link rel="canonical" href="https://microcreatif.ca/contact.html">
<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
color:white;
text-align:center;
background-image:url("images/background.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

/* NAVIGATION */
nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:center;
align-items:center;
gap:40px;
padding:20px;
font-size:18px;
box-sizing:border-box;
z-index:100;
}

nav a{
color:white;
text-decoration:none;
cursor:pointer;
white-space:nowrap;
}

/* DROPDOWN */
.dropdown{
position:relative;
}

.nav-caret-icon{
font-size:10px;
margin-inline-start:4px;
opacity:0.7;
pointer-events:none;
}

.submenu{
display:none;
position:absolute;
top:28px;
left:0;
background:rgba(0,0,0,0.6);
padding:10px;
border-radius:10px;
text-align:left;
}

.submenu a{
display:block;
padding:6px 12px;
white-space:nowrap;
}

/* LANGUAGE SELECTOR */
.lang-select-wrap{
position:relative;
display:inline-flex;
align-items:center;
flex-shrink:0;
}
.lang-select-wrap .lang-globe-icon{
position:absolute;
left:12px;
top:50%;
transform:translateY(-50%);
font-size:15px;
line-height:1;
pointer-events:none;
opacity:0.92;
}
.lang-select-wrap .lang-caret-icon{
position:absolute;
right:11px;
top:50%;
transform:translateY(-50%);
font-size:10px;
line-height:1;
pointer-events:none;
opacity:0.75;
color:white;
}
.lang-btn{
appearance:none;
-webkit-appearance:none;
-moz-appearance:none;
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.3);
color:transparent;
padding:6px 0;
width:52px;
border-radius:16px;
cursor:pointer;
font-size:18px;
white-space:nowrap;
overflow:hidden;
flex-shrink:0;
}
.lang-btn option{
color:#111;
background:#fff;
}

/* Arabic / right-to-left layout */
html[dir="rtl"] .submenu{
left:auto;
right:0;
text-align:right;
}
html[dir="rtl"] .lang-select-wrap .lang-globe-icon{
left:auto;
right:12px;
}
html[dir="rtl"] .lang-select-wrap .lang-caret-icon{
right:auto;
left:11px;
}

/* MOBILE */
@media (max-width:430px){
nav{
gap:18px;
font-size:15px;
padding:14px 10px;
}
.lang-btn{
font-size:14px;
width:44px;
}
.lang-select-wrap .lang-globe-icon{left:9px;font-size:13px;}
.lang-select-wrap .lang-caret-icon{right:9px;font-size:9px;}
html[dir="rtl"] .lang-select-wrap .lang-globe-icon{right:9px;}
html[dir="rtl"] .lang-select-wrap .lang-caret-icon{left:9px;}
}

/* CONTENT */
.container{
margin-top:160px;
max-width:800px;
margin-left:auto;
margin-right:auto;
padding:20px;
}

h1{
font-size:48px;
margin-bottom:40px;
}

p{
font-size:20px;
line-height:1.6;
}

.email{
margin-top:30px;
font-size:24px;
font-weight:bold;
direction:ltr;
unicode-bidi:isolate;
}

/* FOOTER */
footer{
margin-top:200px;
padding-bottom:40px;
font-size:14px;
opacity:0.9;
}
</style>
</head>

<body>
<nav data-i18n-aria="mainNavigation">
<a href="index.html" id="navHome" data-i18n="navHome"></a>

<div class="dropdown">
<a id="navApps"><span data-i18n="navApps"></span><span class="nav-caret-icon" aria-hidden="true">▾</span></a>
<div class="submenu" id="appsMenu">
<a href="radec-calculator.html" data-i18n="appRadec"></a>
<a href="virtual-telescope.html" data-i18n="appVirtualTelescope"></a>
<a href="sol-and-stars.html" data-i18n="appSolAndStars"></a>
<a href="alien-sky.html" data-i18n="appAlienSky"></a>
<a href="time-travel.html" data-i18n="appTimeTravelSky"></a>
</div>
</div>

<a href="about.html" id="navAbout" data-i18n="navAbout"></a>
<a href="contact.html" id="navContact" data-i18n="navContact"></a>
<div class="lang-select-wrap">
<span class="lang-globe-icon" aria-hidden="true">🌐</span>
<select id="languageSelect" class="lang-btn" data-i18n-aria="languageSelector"></select>
<span class="lang-caret-icon" aria-hidden="true">▾</span>
</div>
</nav>

<div class="container">
<h1 data-i18n="contactTitle"></h1>
<p data-i18n="contactBody"></p>
<div class="email">contact@microcreatif.ca</div>
</div>

<footer>
<p>© Micro Créatif</p>
<p data-i18n="locations"></p>
<p>Version 2.3</p>
</footer>

<script src="contact-languages.js" defer></script>
</body>
</html>
