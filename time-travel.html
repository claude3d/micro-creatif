<p class="subtitle"
data-en="Stay on Earth, move through time, and watch the real sky transform above you."
data-fr="Restez sur Terre, voyagez dans le temps et observez le vrai ciel se transformer au-dessus de vous."></p>
</section>

<main class="content">

<div class="mode-grid">
<div class="mode-card">
<h2 data-en="Choose a place and time" data-fr="Choisissez un lieu et une époque"></h2>
<p
data-en="Use your current position, enter latitude, longitude, and altitude manually, or choose from 19 historically important preset locations grouped into Africa, the Americas, Asia, and the Mediterranean & Near East. Then choose an exact local date and time anywhere from the distant past to the far future."
data-fr="Utilisez votre position actuelle, entrez manuellement la latitude, la longitude et l’altitude, ou choisissez parmi 19 lieux historiques prédéfinis regroupés en Afrique, dans les Amériques, en Asie, ainsi qu’en Méditerranée et au Proche-Orient. Choisissez ensuite une date et une heure locales précises, dans un passé lointain ou un futur éloigné."></p>
</div>

<div class="mode-card">
<h2 data-en="Move through history" data-fr="Parcourez l’histoire"></h2>
<p
data-en="Slide smoothly through hours, or travel by whole days, months, years, centuries, and millennia. The sky redraws while you move, and the Now button returns instantly to the present."
data-fr="Glissez continuellement d’une heure à l’autre, ou voyagez par jours, mois, années, siècles et millénaires entiers. Le ciel se redessine pendant le déplacement, et le bouton Maintenant vous ramène immédiatement au présent."></p>
</div>
</div>

<div class="card-grid">
<div class="card">
<h2 data-en="The real sky for the date" data-fr="Le vrai ciel à la date choisie"></h2>
<p
data-en="Stars, constellation lines, the Milky Way, the Sun, Moon, and visible planets follow the selected date, local time, and observing location."
data-fr="Les étoiles, les lignes des constellations, la Voie lactée, le Soleil, la Lune et les planètes visibles suivent la date, l’heure locale et la position d’observation choisies."></p>
</div>

<div class="card">
<h2 data-en="Six time scales" data-fr="Six échelles de temps"></h2>
<p
data-en="The Hours control moves continuously through a full day, while Day, Month, Year, Century, and Millennium move in whole calendar steps and preserve all lower-order date and time values."
data-fr="Le réglage Heures se déplace continuellement sur une journée complète, tandis que Jour, Mois, Année, Siècle et Millénaire avancent par étapes calendaires entières en conservant les unités plus petites de la date et de l’heure."></p>
</div>

<p
data-en="Jump directly to seven programmed events: Halley’s Comet in 837, 1066, 1301, and 1986; the Great Comets of 1577 and 1680; and the planetary alignment of May 5, 2000."
data-fr="Accédez directement à sept événements programmés : la comète de Halley en 837, 1066, 1301 et 1986; les grandes comètes de 1577 et 1680; et l’alignement planétaire du 5 mai 2000."></p>
</div>
</div>

data-fr="La même date produit un horizon et un ciel visible différents selon le lieu choisi sur Terre. Les 19 lieux prédéfinis comprennent notamment Machu Picchu, Angkor, Alexandrie, Louxor / Thèbes antique, Jérusalem, Pékin et Grand Zimbabwe. Pour les comètes, l’app choisit automatiquement l’heure où elles atteignent leur plus grande altitude visible depuis la position sélectionnée."></p>
</div>

<li

<li
data-en="Travel with Hours, Day, Month, Year, Century, or Millennium, and return with Now."

<li
data-en="Show major or all constellation lines, constellation shapes, star names, the Milky Way, atmosphere, Sun, Moon, and planets."

<li
data-en="Adjust the limiting magnitude for stars and planets, and pan or zoom the whole-sky view."
data-fr="Régler la magnitude limite des étoiles et des planètes, puis déplacer ou agrandir la vue du ciel entier."></li>
<li
data-en="Select any of seven programmed events: six comet apparitions and the May 5, 2000 planetary alignment."

<section class="advanced">
<h2 data-en="For hardcore users" data-fr="Pour les utilisateurs chevronnés"></h2>

<div class="advanced-grid">

<div class="advanced-block wide">
<h3 data-en="Catalogues and astronomical corrections" data-fr="Catalogues et corrections astronomiques"></h3>

<p
data-en="Time Travel uses the complete HYG 4.2 master catalogue: 119,625 stars, including Hipparcos identifiers and astrometric data where available. Of these, 109,393 stars contain three-dimensional space-motion information. The app also includes constellation-line data and orbital data for its programmed historical comets."
data-fr="Time Travel utilise le catalogue maître HYG 4.2 complet : 119 625 étoiles, avec les identifiants Hipparcos et les données astrométriques lorsqu’ils sont disponibles. Parmi elles, 109 393 étoiles possèdent des données de mouvement spatial en trois dimensions. L’app comprend également les tracés des constellations et les données orbitales de ses comètes historiques programmées."></p>

<ul>
<li
data-en="The stellar catalogue starts at epoch J2000.0. For the selected date, stars with motion data are advanced using their Cartesian X, Y, and Z space velocities. Position, distance, right ascension, declination, and apparent brightness are recalculated for the new epoch."
data-fr="Le catalogue stellaire part de l’époque J2000.0. Pour la date choisie, les étoiles possédant des données de mouvement sont avancées à l’aide de leurs vitesses spatiales cartésiennes X, Y et Z. La position, la distance, l’ascension droite, la déclinaison et la luminosité apparente sont recalculées pour la nouvelle époque."></li>

<li
data-en="The Earth-sky engine applies precession, nutation, and annual aberration. It then uses apparent sidereal time and the observer’s latitude, longitude, and altitude to place the sky correctly above the local horizon."
data-fr="Le moteur du ciel terrestre applique la précession, la nutation et l’aberration annuelle. Il utilise ensuite le temps sidéral apparent ainsi que la latitude, la longitude et l’altitude de l’observateur pour placer correctement le ciel au-dessus de l’horizon local."></li>

<li
data-en="The Sun, Moon, and planets are calculated for the selected date and location. The Moon uses a topocentric position and its visible phase. Supported historical comets are calculated from their orbital elements."
data-fr="Le Soleil, la Lune et les planètes sont calculés pour la date et la position choisies. La Lune utilise une position topocentrique et sa phase visible. Les comètes historiques prises en charge sont calculées à partir de leurs éléments orbitaux."></li>

<li
data-en="Planet and Moon calculations are intended for approximately 3000 BCE to 3000 CE. Outside that interval, planet positions are extrapolated and may be unsuitable for precise work; the Moon is not shown. A yellow warning triangle explains the limitation when it applies."
data-fr="Les calculs des planètes et de la Lune sont prévus pour environ 3000 av. J.-C. à 3000 apr. J.-C. À l’extérieur de cet intervalle, les positions planétaires sont extrapolées et peuvent ne pas convenir à un travail précis; la Lune n’est pas affichée. Un triangle d’avertissement jaune explique cette limite lorsqu’elle s’applique."></li>
</ul>
</div>

data-fr="Touchez le titre Voyage dans le temps pour passer de la vue normale avec le nord en haut à l’orientation cachée de comparaison avec Stellarium. Les repères N, E, S et O suivent la caméra active. Touchez de nouveau le titre pour revenir à la vue normale."></p>
</div>

<script>
function createStars(){
const container=document.getElementById("stars");
for(let i=0;i<40;i++){
let star=document.createElement("div");
let type=(Math.random()>0.5)?"big":"small";
star.className="star "+type;
star.style.top=Math.random()*100+"%";
star.style.left=Math.random()*100+"%";
star.style.animationDelay=(Math.random()*3)+"s";
star.style.animationDuration=(1+Math.random()*2)+"s";
container.appendChild(star);
}
}
createStars();

const appsButton=document.getElementById("navApps");
const menu=document.getElementById("appsMenu");

appsButton.addEventListener("click",function(e){
e.stopPropagation();
menu.style.display=(menu.style.display==="block")?"none":"block";
});

document.addEventListener("click",function(e){
if(!menu.contains(e.target) && e.target!==appsButton){
menu.style.display="none";
}
});

document.querySelectorAll(".submenu a").forEach(function(link){
link.addEventListener("click",function(){
menu.style.display="none";
});
});

let currentLanguage = localStorage.getItem("mc_language") || "en";

function applyLanguage(){
document.querySelectorAll("[data-en]").forEach(el=>{
el.textContent = el.getAttribute("data-"+currentLanguage);
});
}

function toggleLanguage(){
currentLanguage = (currentLanguage==="en")?"fr":"en";
localStorage.setItem("mc_language", currentLanguage);
applyLanguage();
}

document.addEventListener("DOMContentLoaded",applyLanguage);
</script>
