<div class="shot"><img src="images/SS-1.png" alt="Gaia catalogue screen"><p class="caption" data-en="Large Milky Way catalogue, sortable by name, position, distance, colour, motion, magnitude, exoplanet status, and other available data." data-fr="Vaste catalogue de la Voie lactée, triable par nom, position, distance, couleur, mouvement, magnitude, présence d’exoplanètes et autres données disponibles."></p></div>

<div class="card">
<h2 data-en="The Solar System" data-fr="Le Système solaire"></h2>
<p data-en="Explore the Sun and every planet through detailed reference information, including mass, size, atmosphere, orbital characteristics, and other physical data. The app also calculates each object’s current position and coordinates in real time." data-fr="Explorez le Soleil et chaque planète grâce à des informations de référence détaillées, notamment la masse, les dimensions, l’atmosphère, les caractéristiques orbitales et d’autres données physiques. L’application calcule aussi en temps réel la position et les coordonnées actuelles de chaque objet."></p>
</div>

<div class="card">
<h2 data-en="The Milky Way catalogue" data-fr="Le catalogue de la Voie lactée"></h2>
<p data-en="The second section opens a large catalogue of stars in the Milky Way, with available data such as position, distance, brightness, colour, motion, spectral information, and known exoplanets." data-fr="La seconde section ouvre un vaste catalogue d’étoiles de la Voie lactée, avec les données disponibles telles que la position, la distance, la luminosité, la couleur, le mouvement, les informations spectrales et les exoplanètes connues."></p>
</div>

<div class="card">
<h2 data-en="Current coordinates" data-fr="Coordonnées actuelles"></h2>
<p data-en="For the Sun, planets, and catalogue stars, the app calculates current right ascension and declination for the selected date, using the available motion and astronomical data." data-fr="Pour le Soleil, les planètes et les étoiles du catalogue, l’application calcule l’ascension droite et la déclinaison actuelles pour la date choisie, à partir des données astronomiques et de mouvement disponibles."></p>
</div>

<div class="card">
<h2 data-en="Sortable data" data-fr="Données triables"></h2>
<p data-en="Sort and compare the catalogue by name, sky position, distance, magnitude, colour, motion, exoplanet status, and other available fields." data-fr="Triez et comparez le catalogue par nom, position dans le ciel, distance, magnitude, couleur, mouvement, présence d’exoplanètes et autres champs disponibles."></p>
</div>

<div class="card">
<h2 data-en="Distance units" data-fr="Unités de distance"></h2>
<p data-en="Distances can be displayed in light-years or parsecs." data-fr="Les distances peuvent être affichées en années-lumière ou en parsecs."></p>
</div>

<div class="card">
<h2 data-en="For observers" data-fr="Pour les observateurs"></h2>
<p data-en="Useful as both a Solar System reference and a professional-style stellar database for observation planning, comparison, research, and exploration." data-fr="Utile à la fois comme référence sur le Système solaire et comme base de données stellaire de type professionnel pour préparer des observations, comparer, rechercher et explorer."></p>
</div>

<div class="card wide">
<h2 data-en="Main idea" data-fr="Idée principale"></h2>
<p data-en="Sol and Stars gives equal importance to its two main sections: a detailed, continuously calculated view of our Solar System and a powerful Milky Way catalogue for exploring and comparing stars." data-fr="Sol et les étoiles accorde une importance égale à ses deux sections principales : une présentation détaillée et calculée en continu de notre Système solaire, et un puissant catalogue de la Voie lactée pour explorer et comparer les étoiles."></p>
</div>

<script>
const appsButton=document.getElementById("navApps");
const menu=document.getElementById("appsMenu");

appsButton.addEventListener("click",function(e){
e.stopPropagation();
menu.style.display=(menu.style.display==="block")?"none":"block";
});

document.addEventListener("click",function(e){
if(!menu.contains(e.target) && e.target!==appsButton){menu.style.display="none";}
});

document.querySelectorAll(".submenu a").forEach(function(link){
link.addEventListener("click",function(){menu.style.display="none";});
});

let currentLanguage=localStorage.getItem("mc_language")||"en";

function applyLanguage(){
document.querySelectorAll("[data-en]").forEach(el=>{
el.textContent=el.getAttribute("data-"+currentLanguage);
});
}

function toggleLanguage(){
currentLanguage=(currentLanguage==="en")?"fr":"en";
localStorage.setItem("mc_language",currentLanguage);
applyLanguage();
}

document.addEventListener("DOMContentLoaded",applyLanguage);
</script>
