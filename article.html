<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From the Great Dream... to Reality! - Micro Créatif</title>
<style>
:root{--bg-color:#f4f4f9;--paper-color:#fff;--text-color:#2c3e50;--accent-color:#2980b9;--btn-color:#34495e;}
body{font-family:Georgia,serif;line-height:1.6;background:var(--bg-color);color:var(--text-color);margin:0;padding:20px;display:flex;justify-content:center;}
.container{background:var(--paper-color);max-width:800px;padding:40px 60px;box-shadow:0 4px 15px rgba(0,0,0,.1);border-radius:8px;position:relative;}
header{border-bottom:2px solid var(--accent-color);margin-bottom:30px;padding-bottom:20px;}
h1{font-size:2.2em;margin:0;color:var(--text-color);line-height:1.2;}
.author-box{font-style:italic;color:#555;margin-top:15px;font-size:1.1em;}
article h2{font-family:Helvetica,sans-serif;color:var(--accent-color);border-left:4px solid var(--accent-color);padding-left:15px;margin-top:35px;font-size:1.5em;}
article p{margin-bottom:1.5em;text-align:justify;}
.highlight{font-weight:bold;color:var(--accent-color);}
.nav-buttons{display:flex;gap:15px;margin-top:40px;justify-content:center;border-top:1px solid #eee;padding-top:30px;}
.btn{display:inline-block;padding:10px 20px;background:var(--btn-color);color:white;text-decoration:none;border-radius:5px;font-family:Helvetica,sans-serif;font-size:.9em;font-weight:bold;}
.btn:hover{background:var(--accent-color);}
footer{margin-top:30px;text-align:center;font-size:.8em;color:#888;}
.site-nav{display:flex;justify-content:center;align-items:center;gap:24px;flex-wrap:wrap;position:relative;z-index:1000;margin-bottom:24px;padding:0 0 18px;border-bottom:1px solid #ddd;font-family:Arial,Helvetica,sans-serif;}
.site-nav a,.site-nav button,.site-nav select{color:#2c3e50;background:transparent;font:inherit;font-size:16px;white-space:nowrap;}
.site-nav a,.site-nav button{border:0;padding:6px 0;text-decoration:none;cursor:pointer;}
.site-nav a:hover,.site-nav button:hover{color:#2980b9;}
.site-dropdown{position:relative;}
.site-submenu{display:none;position:absolute;top:34px;left:50%;transform:translateX(-50%);min-width:240px;padding:8px 0;background:#fff;border:1px solid #d4d8dc;border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.16);text-align:left;z-index:1100;}
.site-submenu.open{display:block;}
.site-submenu a{display:block;padding:9px 15px;font-size:15px;}
.site-submenu a:hover{background:#f1f4f7;}
.site-lang{border:1px solid #b8c0c8 !important;border-radius:16px !important;padding:4px 11px !important;}
html[dir="rtl"] article h2{border-left:0;border-right:4px solid var(--accent-color);padding-left:0;padding-right:15px;}
html[dir="rtl"] .site-submenu{text-align:right;}
@media(max-width:600px){
.container{padding:20px;}
.nav-buttons{flex-direction:column;align-items:center;}
.btn{width:100%;text-align:center;box-sizing:border-box;}
.site-nav{gap:15px;}
.site-nav a,.site-nav button,.site-nav select{font-size:14px;}
.site-submenu{position:fixed;top:70px;left:50%;width:min(280px,calc(100vw - 32px));}
}
</style>
</head>
<body>
<div class="container">
<nav class="site-nav" id="siteNav">
<a id="navHome" href="index.html"></a>
<div class="site-dropdown">
<button type="button" id="navApps" class="site-apps-button" aria-expanded="false"></button>
<div class="site-submenu">
<a id="appRadec" href="radec-calculator.html"></a>
<a id="appVirtualTelescope" href="virtual-telescope.html"></a>
<a id="appSolAndStars" href="sol-and-stars.html"></a>
<a id="appAlienSky" href="alien-sky.html"></a>
<a id="appTimeTravelSky" href="time-travel.html"></a>
</div>
</div>
<a id="navAbout" href="about.html"></a>
<a id="navContact" href="contact.html"></a>
<select id="languageSelect" class="site-lang"></select>
</nav>
<header>
<h1 id="articleTitle"></h1>
<div class="author-box" id="authorBox"></div>
</header>
<article id="articleBody"></article>
<div class="nav-buttons"><a href="about.html" class="btn" id="backButton"></a></div>
<footer>&copy; Micro Créatif - <span id="locations"></span></footer>
</div>
<script src="article-languages.js" defer></script>
</body>
</html>
