font-size:18px;

}

padding:42px 20px 22px;
max-width:1100px;
margin:0 auto;
}
.app-icon{
width:112px;
height:112px;
border-radius:25px;
margin:0 auto 18px;
overflow:hidden;
border:2px solid rgba(255,255,255,0.45);
box-shadow:0 0 18px rgba(0,255,60,0.45), 0 0 0 1px white inset;
}
.app-icon img{
width:100%;
height:100%;
object-fit:cover;
display:block;

h1{
font-size:56px;
margin:0 0 10px;
color:#00ff28;
text-shadow:0 0 18px rgba(0,255,60,0.65);
}
.subtitle{
font-size:22px;
line-height:1.45;
max-width:900px;
margin:0 auto;
opacity:0.95;
}
.screenshots{

margin:18px auto 28px;

border:1px solid rgba(255,255,255,0.22);
border-radius:18px;
box-shadow:0 0 18px rgba(0,255,60,0.18);

}
.shot img{
width:100%;
display:block;
}
.caption{
font-size:15px;
line-height:1.35;
margin:10px 12px 14px;
opacity:0.86;
}
.content{
max-width:1120px;
margin:0 auto;
padding:0 20px 40px;
}
.cards{
display:grid;
grid-template-columns:repeat(3, 1fr);

.status h2{

<section class="hero">
<div class="app-icon"><img src="images/app2.png" alt="Virtual Telescope app icon"></div>
<h1 data-en="Virtual Telescope" data-fr="Télescope virtuel"></h1>
<p class="subtitle" data-en="Simulate the actual field of view of a telescope and eyepiece. Enter the focal length, eyepiece, apparent field of view, target coordinates, and limiting magnitude, then compare the simulated star field with what you should see at the eyepiece." data-fr="Simulez le champ réel d’un télescope et d’un oculaire. Entrez la longueur focale, l’oculaire, le champ apparent, les coordonnées de la cible et la magnitude limite, puis comparez le champ simulé avec ce que vous devriez voir à l’oculaire."></p>
</section>
<section class="screenshots" aria-label="Virtual Telescope screenshots">
<div class="shot"><img src="images/VT-1.png" alt="Virtual Telescope star field view centered on Deneb"><p class="caption" data-en="Example: field centered on Deneb." data-fr="Exemple : champ centré sur Deneb."></p></div>


<div class="shot"><img src="images/VT-2.png" alt="Virtual Telescope input screen"><p class="caption" data-en="What you should see in the telescope eyepiece." data-fr="Ce que vous devriez voir dans l’oculaire du télescope."></p></div>


</section>
<main class="content">
<div class="cards">
<div class="card">
<h2 data-en="True field of view" data-fr="Champ réel"></h2>
<p data-en="The app computes the true field of view from telescope and eyepiece parameters. If your telescope and eyepiece match the example, the stars visible through the eyepiece should closely match the simulation." data-fr="L’application calcule le champ réel à partir du télescope et de l’oculaire. Si votre télescope et votre oculaire correspondent à l’exemple, les étoiles visibles à l’oculaire devraient correspondre de près à la simulation."></p>
</div>
<div class="card">
<h2 data-en="Catalogue positions" data-fr="Positions du catalogue"></h2>
<p data-en="Star positions are based on the Gaia catalogue and corrected for the selected observation date. Atmospheric refraction is not simulated." data-fr="Les positions stellaires sont basées sur le catalogue Gaia et corrigées pour la date d’observation choisie. La réfraction atmosphérique n’est pas simulée."></p>
</div>
<div class="card">
<h2 data-en="Magnitude limit" data-fr="Magnitude limite"></h2>
<p data-en="Choose how faint the displayed stars should be. This makes it possible to simulate different instruments and observing conditions." data-fr="Choisissez jusqu’à quelle magnitude les étoiles doivent être affichées. Cela permet de simuler différents instruments et différentes conditions d’observation."></p>
</div>
<div class="card">
<h2 data-en="For observers" data-fr="Pour les observateurs"></h2>
<p data-en="Useful for preparing a session, checking whether an object fits in the eyepiece, and understanding how a change of eyepiece changes the view." data-fr="Utile pour préparer une séance, vérifier si un objet entre dans l’oculaire et comprendre comment un changement d’oculaire modifie la vue."></p>
</div>
<div class="card wide">
<h2 data-en="Planned features" data-fr="Fonctions prévues"></h2>
<ul>
<li data-en="Calculate true field of view from telescope and eyepiece data." data-fr="Calculer le champ réel à partir des données du télescope et de l’oculaire."></li>
<li data-en="Display a circular star field centered on RA/Dec coordinates." data-fr="Afficher un champ stellaire circulaire centré sur des coordonnées AD/Déc."></li>
<li data-en="Use Gaia-based stellar positions corrected for the selected date." data-fr="Utiliser des positions stellaires basées sur Gaia et corrigées pour la date choisie."></li>
<li data-en="Do not apply atmospheric refraction to the simulated eyepiece field." data-fr="Ne pas appliquer la réfraction atmosphérique au champ simulé de l’oculaire."></li>
<li data-en="Let the observer choose the limiting magnitude." data-fr="Permettre à l’observateur de choisir la magnitude limite."></li>
<li data-en="Keep the interface simple and useful at the telescope." data-fr="Garder une interface simple et utile au télescope."></li>
</ul>
</div>
</div>
<section class="status">
<h2 data-en="Status" data-fr="Statut"></h2>
<p data-en="Virtual Telescope is part of the Micro Créatif astronomy app collection. A modern version is being prepared for iPhone and iPad." data-fr="Télescope virtuel fait partie de la collection d’applications d’astronomie de Micro Créatif. Une version moderne est en préparation pour iPhone et iPad."></p>
<a class="back" href="index.html" data-en="← Back to apps" data-fr="← Retour aux apps"></a>
</section>

</footer>
<script>
const appsButton=document.getElementById("navApps");
const menu=document.getElementById("appsMenu");
appsButton.addEventListener("click",function(e){
e.stopPropagation();
menu.style.display=(menu.style.display==="block")?"none":"block";
});
document.addEventListener("click",function(e){
if(!menu.contains(e.target) && e.target!==appsButton){menu.style.display="none";}
});
document.querySelectorAll(".submenu a").forEach(function(link){
link.addEventListener("click",function(){menu.style.display="none";});
});
let currentLanguage=localStorage.getItem("mc_language")||"en";
function applyLanguage(){
document.querySelectorAll("[data-en]").forEach(el=>{el.textContent=el.getAttribute("data-"+currentLanguage);});
}
function toggleLanguage(){
currentLanguage=(currentLanguage==="en")?"fr":"en";
localStorage.setItem("mc_language",currentLanguage);
applyLanguage();
}
document.addEventListener("DOMContentLoaded",applyLanguage);
</script>
