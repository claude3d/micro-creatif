<!DOCTYPE html>
<html lang="en">
<!-- Micro Créatif -->
<!-- time-travel.html -->
<!-- Version 3.0 -->
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title></title>
<meta content="" name="description"/>
<meta content="" name="keywords"/>
<meta content="Micro Créatif" name="author"/>
<meta content="index, follow" name="robots"/>
<meta content="" property="og:title"/>
<meta content="" property="og:description"/>
<meta content="https://microcreatif.ca/time-travel.html" property="og:url"/>
<meta content="website" property="og:type"/>
<meta content="en_CA" property="og:locale"/>

<link href="https://microcreatif.ca/time-travel.html" rel="canonical"/>
<style>
*{box-sizing:border-box;}
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
color:white;
text-align:center;
background:black;
overflow-x:hidden;
}
.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-5;
filter:brightness(0.72);
}
.star{
position:fixed;
background:white;
border-radius:50%;
z-index:-4;
box-shadow:0 0 6px rgba(255,255,255,1),0 0 12px rgba(255,255,255,0.9),0 0 20px rgba(255,255,255,0.6);
animation:twinkle infinite;
}
.star.big{width:3px;height:3px;}
.star.small{width:2px;height:2px;}
@keyframes twinkle{
0%{opacity:0.2; transform:scale(0.8);}
50%{opacity:1; transform:scale(1.8);}
100%{opacity:0.2; transform:scale(0.8);}
}
header{
position:relative;
padding:12px 10px 0;
z-index:100;
}
nav{
display:inline-flex;
gap:30px;
position:relative;
align-items:center;
}
nav a{
color:white;
text-decoration:none;
font-size:18px;
opacity:0.9;
cursor:pointer;
white-space:nowrap;
}
.dropdown{position:relative;display:inline-flex;align-items:center;}
.submenu{
display:none;
position:absolute;
top:28px;
left:0;
background:rgba(0,0,0,0.72);
border:1px solid rgba(255,255,255,0.3);
border-radius:10px;
padding:8px 0;
min-width:240px;
text-align:left;
}
.submenu a{display:block;padding:8px 14px;font-size:16px;}
.submenu a:hover{background:rgba(255,255,255,0.1);}
.lang-btn{
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.3);
color:white;
padding:6px 14px;
border-radius:16px;
cursor:pointer;
font-size:18px;
white-space:nowrap;
flex-shrink:0;
}
.hero{
min-height:42vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:45px 20px 20px;
}
.app-icon{
width:132px;
height:132px;
border-radius:28px;
margin-bottom:18px;
overflow:hidden;
border:2px solid rgba(255,255,255,0.45);
box-shadow:0 0 22px rgba(120,170,255,0.4), 0 0 0 1px white inset;
}
.app-icon img{width:100%;height:100%;object-fit:cover;display:block;}
h1{
font-size:56px;
line-height:1.0;
margin:8px 0 10px;
text-shadow:0 0 16px rgba(140,190,255,0.55);
}
.subtitle{
font-size:22px;
max-width:820px;
margin:0 auto;
line-height:1.35;
opacity:0.95;
}
.content{
max-width:1040px;
margin:0 auto;
padding:10px 22px 40px;
}
.mode-grid{
display:grid;
grid-template-columns:repeat(2, 1fr);
gap:20px;
margin-top:24px;
}
.mode-card{
background:rgba(8,10,28,0.72);
border:1px solid rgba(255,255,255,0.25);
border-radius:22px;
padding:26px;
box-shadow:0 0 22px rgba(0,0,0,0.28);
}
.mode-card h2{
font-size:30px;
margin:0 0 12px;
color:#dbe8ff;
}
.mode-card p{
font-size:18px;
line-height:1.48;
margin:0;
opacity:0.94;
}
.card-grid{
display:grid;
grid-template-columns:repeat(3, 1fr);
gap:18px;
margin-top:24px;
}
.card{
background:rgba(8,10,28,0.66);
border:1px solid rgba(255,255,255,0.22);
border-radius:18px;
padding:22px;
box-shadow:0 0 20px rgba(0,0,0,0.25);
}
.card h2{
font-size:24px;
margin:0 0 12px;
color:#dbe8ff;
}
.card p{
font-size:17px;
line-height:1.45;
margin:0;
opacity:0.92;
}
.lower-row{
display:grid;
grid-template-columns:1fr 1.65fr;
gap:18px;
margin-top:18px;
align-items:stretch;
}
.feature-list{
margin:0;
max-width:none;
text-align:left;
background:rgba(0,0,0,0.42);
border:1px solid rgba(255,255,255,0.2);
border-radius:18px;
padding:24px 28px;
}
.feature-list h2{
text-align:center;
font-size:28px;
margin:0 0 14px;
}
ul{margin:0;padding-left:24px;}
li{font-size:18px;line-height:1.55;margin:6px 0;}

.advanced{
margin-top:24px;
padding:28px;
text-align:left;
background:rgba(5,8,24,0.78);
border:1px solid rgba(170,200,255,0.35);
border-radius:22px;
box-shadow:0 0 24px rgba(60,100,180,0.22);
}
.advanced > h2{
text-align:center;
font-size:32px;
margin:0 0 20px;
color:#e2edff;
}
.advanced-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}
.advanced-block{
background:rgba(255,255,255,0.055);
border:1px solid rgba(255,255,255,0.16);
border-radius:16px;
padding:20px 22px;
}
.advanced-block.wide{
grid-column:1 / -1;
}
.advanced-block.centered-half{
grid-column:1 / -1;
width:calc((100% - 18px) / 2);
justify-self:center;
}
.advanced-block h3{
font-size:23px;
margin:0 0 12px;
color:#dbe8ff;
}
.advanced-block h3.centered-title{
text-align:center;
}
.advanced-block p{
font-size:17px;
line-height:1.52;
margin:0 0 12px;
opacity:0.94;
}
.advanced-block p:last-child{margin-bottom:0;}
.advanced-block ul{
margin:0;
padding-left:23px;
}
.advanced-block li{
font-size:17px;
line-height:1.5;
margin:7px 0;
}
.key-row{
display:grid;
grid-template-columns:105px 1fr;
gap:12px;
align-items:center;
margin:9px 0;
font-size:17px;
line-height:1.4;
}
.key-row code{
display:inline-block;
text-align:center;
font-family:Menlo, Monaco, Consolas, monospace;
font-size:16px;
font-weight:bold;
color:white;
background:rgba(255,255,255,0.11);
border:1px solid rgba(255,255,255,0.28);
border-radius:8px;
padding:6px 8px;
white-space:nowrap;
}

.keyboard-panel{
margin-top:4px;
}
.keyboard-intro{
text-align:center;
max-width:820px;
margin:0 auto 18px !important;
}
.keyboard-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}
.keyboard-card{
background:rgba(0,0,0,0.28);
border:1px solid rgba(190,215,255,0.23);
border-radius:15px;
padding:18px;
}
.keyboard-card h4{
font-size:20px;
margin:0 0 14px;
color:#e6efff;
text-align:center;
}
.shortcut-row{
display:grid;
grid-template-columns:minmax(145px, 0.9fr) 1.35fr;
gap:13px;
align-items:center;
padding:8px 0;
border-bottom:1px solid rgba(255,255,255,0.08);
}
.shortcut-row:last-child{border-bottom:0;}
.keycaps{
display:flex;
flex-wrap:wrap;
gap:5px;
align-items:center;
justify-content:flex-start;
}
.keycap{
display:inline-flex;
align-items:center;
justify-content:center;
min-width:34px;
min-height:31px;
padding:4px 9px;
font-family:Menlo, Monaco, Consolas, monospace;
font-size:14px;
font-weight:700;
line-height:1;
color:#fff;
background:linear-gradient(rgba(255,255,255,0.18), rgba(255,255,255,0.08));
border:1px solid rgba(255,255,255,0.34);
border-bottom-width:3px;
border-radius:7px;
box-shadow:0 2px 6px rgba(0,0,0,0.25), inset 0 1px rgba(255,255,255,0.15);
white-space:nowrap;
}
.keycap.wide{min-width:62px;}
.keycap.command{min-width:72px;}
.key-separator{
font-size:13px;
opacity:0.58;
padding:0 1px;
}
.shortcut-action{
font-size:15.5px;
line-height:1.35;
opacity:0.94;
}
.keyboard-note{
margin:16px 0 0 !important;
font-size:15px !important;
text-align:center;
opacity:0.78 !important;
}


.screenshot-gallery{
margin:6px auto 30px;
}
.screenshot-grid{
display:grid;
grid-template-columns:repeat(2, minmax(0, 1fr));
gap:18px;
}
.screenshot-frame{
margin:0;
background:rgba(5,8,24,0.70);
border:1px solid rgba(190,215,255,0.28);
border-radius:18px;
padding:8px;
box-shadow:0 0 22px rgba(40,80,160,0.20);
overflow:hidden;
}
.screenshot-frame img{
display:block;
width:100%;
height:auto;
border-radius:12px;
}

.status{
margin:30px auto 0;
max-width:800px;
padding:22px;
background:rgba(90,60,120,0.28);
border:1px solid rgba(255,255,255,0.22);
border-radius:18px;
}
.status h2{font-size:28px;margin:0 0 12px;}
.status p{font-size:18px;line-height:1.45;margin:0;}
.btn{
display:inline-block;
margin-top:28px;
padding:14px 38px;
font-size:20px;
font-weight:bold;
color:white;
text-decoration:none;
border:2px solid rgba(180, 200, 255, 0.75);
border-radius:30px;
background:rgba(255,255,255,0.12);
box-shadow:0 0 18px rgba(120,170,255,0.45);
}
.btn:hover{box-shadow:0 0 28px rgba(150,200,255,0.8);}
footer{
padding:26px 20px 34px;
font-size:18px;
line-height:1.7;
opacity:0.9;
}
@media (max-width:760px){
nav{gap:18px;}
nav a{font-size:15px;}
.lang-btn{font-size:15px;padding:4px 10px;}
h1{font-size:42px;}
.subtitle{font-size:19px;}
.mode-grid{grid-template-columns:1fr;}
.screenshot-grid{grid-template-columns:1fr;}
.card-grid{grid-template-columns:1fr;}
.lower-row{grid-template-columns:1fr;}
.advanced-grid{grid-template-columns:1fr;}
.advanced-block.wide{grid-column:auto;}
.advanced-block.centered-half{grid-column:auto;width:100%;}
.keyboard-grid{grid-template-columns:1fr;}
.shortcut-row{grid-template-columns:138px 1fr;}
.key-row{grid-template-columns:92px 1fr;}
.app-icon{width:116px;height:116px;border-radius:25px;}
.content{padding-left:16px;padding-right:16px;}
.feature-list{padding:20px;}
li{font-size:17px;}
}


/* Arabic / right-to-left layout */
html[dir="rtl"] .submenu{
left:auto;
right:0;
text-align:right;
}
html[dir="rtl"] .feature-list,
html[dir="rtl"] .advanced,
html[dir="rtl"] .advanced-block{
text-align:right;
}
html[dir="rtl"] ul{
padding-left:0;
padding-right:24px;
}
html[dir="rtl"] .advanced-block ul{
padding-left:0;
padding-right:23px;
}
html[dir="rtl"] .key-row,
html[dir="rtl"] .shortcut-row{
direction:ltr;
}
html[dir="rtl"] .key-row > span,
html[dir="rtl"] .shortcut-action{
direction:rtl;
text-align:right;
}
html[dir="rtl"] .keycaps,
html[dir="rtl"] .key-row code{
direction:ltr;
}

</style>
</head>
<body>
<img class="bg" data-i18n-alt="alt.background" src="images/galaxy-background.jpg"/>
<div id="stars"></div>
<header>
<nav data-i18n-aria-label="aria.mainNavigation">
<a data-i18n="nav.home" href="index.html" id="navHome"></a>
<div class="dropdown">
<a data-i18n="nav.apps" id="navApps"></a>
<div class="submenu" id="appsMenu">
<a data-i18n="nav.radec" href="radec-calculator.html"></a>
<a data-i18n="nav.virtualTelescope" href="virtual-telescope.html"></a>
<a data-i18n="nav.solAndStars" href="sol-and-stars.html"></a>
<a data-i18n="nav.alienSky" href="alien-sky.html"></a>
<a data-i18n="nav.timeTravel" href="time-travel.html"></a>
</div>
</div>
<a data-i18n="nav.about" href="about.html" id="navAbout"></a>
<a data-i18n="nav.contact" href="contact.html" id="navContact"></a>
<select class="lang-btn" data-i18n-aria-label="aria.languageSelector" id="languageSelect"></select>
</nav>
</header>
<section class="hero" data-i18n-aria-label="aria.hero">
<div class="app-icon">
<img data-i18n-alt="alt.appIcon" src="images/TimeTravel.png"/>
</div>
<h1 data-i18n="hero.title"></h1>
<p class="subtitle" data-i18n="hero.subtitle"></p>
</section>
<main class="content">
<section class="screenshot-gallery">
<div class="screenshot-grid">
<figure class="screenshot-frame">
<img alt="" aria-hidden="true" loading="lazy" src="images/TheSky.png"/>
</figure>
<figure class="screenshot-frame">
<img alt="" aria-hidden="true" loading="lazy" src="images/ChooseLocation.png"/>
</figure>
<figure class="screenshot-frame">
<img alt="" aria-hidden="true" loading="lazy" src="images/ChooseTime.png"/>
</figure>
<figure class="screenshot-frame">
<img alt="" aria-hidden="true" loading="lazy" src="images/ChooseLocationMnually.png"/>
</figure>
</div>
</section>
<div class="mode-grid">
<div class="mode-card">
<h2 data-i18n="mode.placeTime.title"></h2>
<p data-i18n="mode.placeTime.body"></p>
</div>
<div class="mode-card">
<h2 data-i18n="mode.history.title"></h2>
<p data-i18n="mode.history.body"></p>
</div>
</div>
<div class="card-grid">
<div class="card">
<h2 data-i18n="cards.realSky.title"></h2>
<p data-i18n="cards.realSky.body"></p>
</div>
<div class="card">
<h2 data-i18n="cards.timeScales.title"></h2>
<p data-i18n="cards.timeScales.body"></p>
</div>
<div class="card">
<h2 data-i18n="cards.events.title"></h2>
<p data-i18n="cards.events.body"></p>
</div>
</div>
<div class="lower-row">
<div class="card">
<h2 data-i18n="cards.location.title"></h2>
<p data-i18n="cards.location.body"></p>
</div>
<section class="feature-list">
<h2 data-i18n="features.title"></h2>
<ul>
<li data-i18n="features.location"></li>
<li data-i18n="features.exactDate"></li>
<li data-i18n="features.travelScales"></li>
<li data-i18n="features.skyLayers"></li>
<li data-i18n="features.magnitude"></li>
<li data-i18n="features.events"></li>
<li data-i18n="features.keyboard"></li>
</ul>
</section>
</div>
<section class="advanced">
<h2 data-i18n="eclipses.title"></h2>
<div class="advanced-grid">
<div class="advanced-block wide">
<h3 class="centered-title" data-i18n="eclipses.missed.title"></h3>
<p data-i18n="eclipses.missed.body"></p>
</div>
<div class="advanced-block wide">
<h3 class="centered-title" data-i18n="eclipses.battle.title"></h3>
<p data-i18n="eclipses.battle.body1"></p>
<p data-i18n="eclipses.battle.body2"></p>
<p data-i18n="eclipses.battle.body3"></p>
</div>
</div>
</section>
<section class="advanced">
<h2 data-i18n="hardcore.title"></h2>
<div class="advanced-grid">
<div class="advanced-block wide">
<h3 data-i18n="hardcore.catalogue.title"></h3>
<p data-i18n="hardcore.catalogue.intro"></p>
<ul>
<li data-i18n="hardcore.catalogue.stars"></li>
<li data-i18n="hardcore.catalogue.earth"></li>
<li data-i18n="hardcore.catalogue.solarSystem"></li>
<li data-i18n="hardcore.catalogue.limitations"></li>
</ul>
</div>
<div class="advanced-block centered-half">
<h3 class="centered-title" data-i18n="skyControls.title"></h3>
<div class="key-row">
<code>← → ↑ ↓</code>
<span data-i18n="skyControls.move"></span>
</div>
<div class="key-row">
<code>+ / −</code>
<span data-i18n="skyControls.zoom"></span>
</div>
<div class="key-row">
<code>0</code>
<span data-i18n="skyControls.reset"></span>
</div>
<div class="key-row">
<code>⌘ + Click</code>
<span data-i18n="skyControls.catalogNames"></span>
</div>
<p data-i18n="skyControls.touch"></p>
<p data-i18n="skyControls.catalogNamesNote"></p>
</div>
<div class="advanced-block wide keyboard-panel">
<h3 class="centered-title" data-i18n="keyboard.title"></h3>
<p class="keyboard-intro" data-i18n="keyboard.intro"></p>
<div class="keyboard-grid">
<div class="keyboard-card">
<h4 data-i18n="keyboard.dateTime.title"></h4>
<div class="shortcut-row">
<div class="keycaps"><span class="keycap wide">0–9</span></div>
<span class="shortcut-action" data-i18n="keyboard.enterNumbers"></span>
</div>
<div class="shortcut-row">
<div class="keycaps"><span class="keycap wide">Tab</span><span class="key-separator">/</span><span class="keycap wide">Return</span><span class="key-separator">/</span><span class="keycap">→</span></div>
<span class="shortcut-action" data-i18n="keyboard.nextField"></span>
</div>
<div class="shortcut-row">
<div class="keycaps"><span class="keycap wide">⇧ Tab</span><span class="key-separator">/</span><span class="keycap">←</span></div>
<span class="shortcut-action" data-i18n="keyboard.previousField"></span>
</div>
<div class="shortcut-row">
<div class="keycaps"><span class="keycap">⌫</span><span class="key-separator">/</span><span class="keycap">⌦</span></div>
<span class="shortcut-action" data-i18n="keyboard.erase"></span>
</div>
<div class="shortcut-row">
<div class="keycaps"><span class="keycap">B</span><span class="key-separator">/</span><span class="keycap">C</span></div>
<span class="shortcut-action" data-i18n="keyboard.era"></span>
</div>
<div class="shortcut-row">
<div class="keycaps"><span class="keycap command">⌘ Return</span></div>
<span class="shortcut-action" data-i18n="keyboard.apply"></span>
</div>
<div class="shortcut-row">
<div class="keycaps"><span class="keycap wide">Esc</span><span class="key-separator">/</span><span class="keycap command">⌘ .</span><span class="key-separator">/</span><span class="keycap command">⌘ [</span></div>
<span class="shortcut-action" data-i18n="keyboard.cancel"></span>
</div>
</div>
<div class="keyboard-card">
<h4 data-i18n="keyboard.location.title"></h4>
<div class="shortcut-row">
<div class="keycaps"><span class="keycap wide">0–9</span></div>
<span class="shortcut-action" data-i18n="keyboard.enterNumbers"></span>
</div>
<div class="shortcut-row">
<div class="keycaps"><span class="keycap wide">Tab</span><span class="key-separator">/</span><span class="keycap wide">Return</span><span class="key-separator">/</span><span class="keycap">→</span></div>
<span class="shortcut-action" data-i18n="keyboard.nextField"></span>
</div>
<div class="shortcut-row">
<div class="keycaps"><span class="keycap wide">⇧ Tab</span><span class="key-separator">/</span><span class="keycap">←</span></div>
<span class="shortcut-action" data-i18n="keyboard.previousField"></span>
</div>
<div class="shortcut-row">
<div class="keycaps"><span class="keycap">⌫</span><span class="key-separator">/</span><span class="keycap">⌦</span></div>
<span class="shortcut-action" data-i18n="keyboard.erase"></span>
</div>
<div class="shortcut-row">
<div class="keycaps"><span class="keycap">N</span><span class="keycap">S</span><span class="keycap">E</span><span class="keycap">W</span></div>
<span class="shortcut-action" data-i18n="keyboard.directions"></span>
</div>
<div class="shortcut-row">
<div class="keycaps"><span class="keycap command">⌘ Return</span></div>
<span class="shortcut-action" data-i18n="keyboard.apply"></span>
</div>
<div class="shortcut-row">
<div class="keycaps"><span class="keycap wide">Esc</span><span class="key-separator">/</span><span class="keycap command">⌘ .</span><span class="key-separator">/</span><span class="keycap command">⌘ [</span></div>
<span class="shortcut-action" data-i18n="keyboard.cancel"></span>
</div>
</div>
</div>
<p class="keyboard-note" data-i18n="keyboard.note"></p>
</div>
<div class="advanced-block centered-half">
<h3 class="centered-title" data-i18n="easterEgg.title"></h3>
<p data-i18n="easterEgg.body"></p>
</div>
</div>
</section>
<section class="status">
<h2 data-i18n="status.title"></h2>
<p data-i18n="status.body"></p>
<a class="btn" data-i18n="status.back" href="index.html"></a>
</section>
</main>
<footer>
<p>© Micro Créatif</p>
<p data-i18n="footer.locations"></p>
<p>Version 3.0</p>
<p data-i18n="footer.privacy"></p>
</footer>

<script src="time-travel-languages.js" defer></script>
</body>
</html>
