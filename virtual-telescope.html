margin:0 0 12px;

font-size:20px;

footer{

opacity:0.88;
}
@media (max-width:760px){

nav a{font-size:15px;}
.lang-btn{font-size:15px;padding:4px 10px;}

.subtitle{font-size:18px;}
.screenshots{grid-template-columns:1fr;}
.cards{grid-template-columns:1fr;}
.wide{grid-column:span 1;}
.app-icon{width:96px;height:96px;}
}

html[dir="rtl"] .submenu{left:auto;right:0;text-align:right;}
html[dir="rtl"] .grid,

<script>
const appsButton=document.getElementById("navApps");
const menu=document.getElementById("appsMenu");
appsButton.addEventListener("click",function(e){
e.stopPropagation();
menu.style.display=(menu.style.display==="block")?"none":"block";
});
document.addEventListener("click",function(e){
if(!menu.contains(e.target) && e.target!==appsButton){menu.style.display="none";}
});
document.querySelectorAll(".submenu a").forEach(function(link){
link.addEventListener("click",function(){menu.style.display="none";});
});
</script>
