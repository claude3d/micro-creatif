<script>
function createStars(){
const container=document.getElementById("stars");
for(let i=0;i<40;i++){
let star=document.createElement("div");
let type=(Math.random()>0.5)?"big":"small";
star.className="star "+type;
star.style.top=Math.random()*100+"%";
star.style.left=Math.random()*100+"%";
star.style.animationDelay=(Math.random()*3)+"s";
star.style.animationDuration=(1+Math.random()*2)+"s";
container.appendChild(star);
}
}
createStars();

const appsButton=document.getElementById("navApps");
const menu=document.getElementById("appsMenu");

appsButton.addEventListener("click",function(e){
e.stopPropagation();
menu.style.display=(menu.style.display==="block")?"none":"block";
});

document.addEventListener("click",function(e){
if(!menu.contains(e.target) && e.target!==appsButton){
menu.style.display="none";
}
});

document.querySelectorAll(".submenu a").forEach(function(link){
link.addEventListener("click",function(){
menu.style.display="none";
});
});
</script>
