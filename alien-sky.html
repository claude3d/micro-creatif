</section>

<main class="content">

data-en="Select a nearby star or search the stellar catalogue. Alien Sky begins with the sky from your location on Earth, then points the journey toward the star you selected."

</div>

<div class="mode-card">
<h2 data-en="Travel through space" data-fr="Voyagez dans l’espace"></h2>
<p
data-en="Move from Earth to the destination and return again. Look forward along the route or turn around to see how the Sun and the familiar constellations change behind you."
data-fr="Voyagez de la Terre jusqu’à votre destination, puis revenez. Regardez vers l’avant ou retournez-vous pour voir comment le Soleil et les constellations familières se transforment derrière vous."></p>
</div>
</div>

<p
data-en="Stars are placed using real positions, distances, brightnesses, colours, and motions. Nearby stars shift the most, while distant constellations change more subtly."
data-fr="Les étoiles sont placées selon leurs vraies positions, distances, luminosités, couleurs et mouvements. Les étoiles proches se déplacent davantage, tandis que les constellations lointaines changent plus subtilement."></p>
</div>

data-fr="Revenez instantanément au ciel terrestre pour comparer la vue familière avec celle du voyage ou celle observée depuis l’étoile de destination."></p>
</div>

data-fr="Le Soleil, la Lune et les planètes commencent à leur position correcte dans le ciel terrestre. En quittant le Système solaire, la Lune et les planètes disparaissent et le Soleil devient un point lointain nommé Sol."></p>

<section class="advanced">
<h2 data-en="For hardcore users" data-fr="Pour les utilisateurs chevronnés"></h2>

<div class="advanced-grid">

<div class="advanced-block wide">
<h3 data-en="Catalogues and astronomical corrections" data-fr="Catalogues et corrections astronomiques"></h3>

<p
data-en="Alien Sky uses the complete HYG 4.2 master catalogue: 119,625 stars, including Hipparcos identifiers and astrometric data where available. Of these, 109,393 stars contain space-motion information. The app also includes constellation-line data and a catalogue of confirmed exoplanet-host systems."
data-fr="Alien Sky utilise le catalogue maître HYG 4.2 complet : 119 625 étoiles, avec les identifiants Hipparcos et les données astrométriques lorsqu’ils sont disponibles. Parmi elles, 109 393 étoiles possèdent des données de mouvement dans l’espace. L’app comprend également les tracés des constellations et un catalogue de systèmes possédant des exoplanètes confirmées."></p>

<ul>
<li
data-en="The catalogue starts at epoch J2000.0. At launch, each star with motion data is advanced to the current date using its three-dimensional Cartesian space velocity. Its X, Y and Z position, distance, right ascension, declination and apparent brightness are then recalculated."
data-fr="Le catalogue part de l’époque J2000.0. Au lancement, chaque étoile possédant des données de mouvement est avancée jusqu’à la date actuelle à l’aide de sa vitesse spatiale cartésienne en trois dimensions. Sa position X, Y et Z, sa distance, son ascension droite, sa déclinaison et sa luminosité apparente sont ensuite recalculées."></li>

<li
data-en="For Earth Sky, the engine applies precession, nutation and annual aberration, then uses apparent sidereal time and the observer’s latitude, longitude and altitude to place the sky correctly above the local horizon."
data-fr="Pour le ciel terrestre, le moteur applique la précession, la nutation et l’aberration annuelle, puis utilise le temps sidéral apparent ainsi que la latitude, la longitude et l’altitude de l’observateur pour placer correctement le ciel au-dessus de l’horizon local."></li>

<li
data-en="The Sun, Moon and planets are calculated for the observer’s date and location. The Moon uses a topocentric position and its visible phase."
data-fr="Le Soleil, la Lune et les planètes sont calculés pour la date et la position de l’observateur. La Lune utilise une position topocentrique et sa phase visible."></li>

<li
data-en="During interstellar travel, Earth-only apparent corrections are deliberately removed. The app works in a physical fixed-J2000 three-dimensional frame, so parallax and the changing shapes of constellations arise naturally from the observer’s new position in space."
data-fr="Pendant le voyage interstellaire, les corrections apparentes propres à l’observation depuis la Terre sont volontairement retirées. L’app travaille dans un repère physique tridimensionnel fixe J2000, de sorte que la parallaxe et la transformation des constellations résultent naturellement de la nouvelle position de l’observateur dans l’espace."></li>
</ul>
</div>

<div class="advanced-block">
<h3 data-en="The Easter egg" data-fr="L’œuf de Pâques"></h3>

<p
data-en="Tap the Alien Sky title to switch to a Stellarium-comparison camera. In Earth Sky, the selected destination is centred while the local zenith remains toward the top. During Travel, the destination stays centred with a Stellarium-style camera roll. The N, E, S and W markers follow the active camera. Tap the title again to return to the normal North-up view."
data-fr="Touchez le titre Alien Sky pour passer à une caméra de comparaison avec Stellarium. Dans le ciel terrestre, la destination choisie est centrée tandis que le zénith local demeure orienté vers le haut. Pendant le voyage, la destination reste centrée avec une orientation de caméra de style Stellarium. Les repères N, E, S et O suivent la caméra active. Touchez de nouveau le titre pour revenir à la vue normale avec le nord en haut."></p>

<script>
function createStars(){
const container=document.getElementById("stars");
for(let i=0;i<40;i++){
let star=document.createElement("div");
let type=(Math.random()>0.5)?"big":"small";
star.className="star "+type;
star.style.top=Math.random()*100+"%";
star.style.left=Math.random()*100+"%";
star.style.animationDelay=(Math.random()*3)+"s";
star.style.animationDuration=(1+Math.random()*2)+"s";
container.appendChild(star);
}
}
createStars();

const appsButton=document.getElementById("navApps");
const menu=document.getElementById("appsMenu");

appsButton.addEventListener("click",function(e){
e.stopPropagation();
menu.style.display=(menu.style.display==="block")?"none":"block";
});

document.addEventListener("click",function(e){
if(!menu.contains(e.target) && e.target!==appsButton){
menu.style.display="none";
}
});

document.querySelectorAll(".submenu a").forEach(function(link){
link.addEventListener("click",function(){
menu.style.display="none";
});
});

let currentLanguage = localStorage.getItem("mc_language") || "en";

function applyLanguage(){
document.querySelectorAll("[data-en]").forEach(el=>{
el.textContent = el.getAttribute("data-"+currentLanguage);
});
}

function toggleLanguage(){
currentLanguage = (currentLanguage==="en")?"fr":"en";
localStorage.setItem("mc_language", currentLanguage);
applyLanguage();
}

document.addEventListener("DOMContentLoaded",applyLanguage);
</script>
